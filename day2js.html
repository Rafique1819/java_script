    <script>
      // Accessing an element of an array--------------------
      // each items has an index.
      let array = [22, 33, 44, 55, 66, 777, 2, 28, 4];
      console.log(array[5]);
      // length of an array------------------

      console.log(array.length);

      // update an array---------------------
      array[4] = 333;
      console.log(array);

      // add an element into the last of an array---------------------
      array.push(434);
      console.log(array);

      // remove the last element of an array----------------
      array.pop();
      console.log(array);

      // add an element into the beginning of an array-----------

      array.unshift(18);
      console.log(array);

      // remove the first element of an array------------------

      array.shift();
      console.log(array);

      // slice() and splice()----------------
      array.slice(1, 4);
      console.log(array);

      // sort an array----------------

      array.sort(function (a, b) {
        return a - b;
      });
      console.log(array);

      // find the second largest element of an array------------------

      let arr = [2, 3, 5, 7, 8, 11, 55, 333];

      let largest = arr[0];
      let secondLargest = arr[0];
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > largest) {
          secondLargest = largest;
          largest = arr[i];
        } else if (arr[i] > secondLargest && arr[i] != largest) {
          secondLargest = arr[i];
        }
      }
